services:
  db:
    image: postgres:16-alpine
    container_name: choir-app-postgres
    environment:
      POSTGRES_DB: choir
      POSTGRES_USER: choir
      POSTGRES_PASSWORD: choir
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choir -d choir"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
