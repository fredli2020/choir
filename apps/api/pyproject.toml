[project]
name = "choir-api"
version = "0.1.0"
description = "Django API for the Choir App modular monolith."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "django-filter>=25.1,<26.0",
  "djangorestframework>=3.15,<4.0",
  "dj-database-url>=2.3,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["E501"]

[tool.uv]
package = false
